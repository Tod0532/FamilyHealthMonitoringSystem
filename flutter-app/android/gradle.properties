org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 使用 Java 17 解决 jlink 兼容性问题
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.17.10-hotspot

# ============================================================================
# 网络代理（下载 Android Gradle Plugin 等需要）
# ============================================================================
# 背景：本机 DNS 会把 dl.google.com 解析到 127.0.0.1（本地代理/VPN 的行为），
# 而 Java 默认**不使用** Windows 系统代理设置，直连时就会命中
# "Connect to dl.google.com:443 [dl.google.com/127.0.0.1] failed: Connection refused"，
# 导致 Gradle 无法下载 com.android.tools.build:gradle 而构建失败。
#
# 解法：这里显式把 Gradle 的 HTTP/HTTPS 流量指向本机代理。
# 原来这两行是留空的（有人想配但没填值），现补全。
#
# 如果你的代理端口不是 7897，或不需要代理（能直连 dl.google.com），
# 请把下面四行注释掉，或用 -D 参数覆盖。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# 代理程序本身不走代理
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
systemProp.https.nonProxyHosts=localhost|127.*|[::1]
