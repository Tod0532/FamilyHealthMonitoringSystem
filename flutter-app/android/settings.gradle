pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        // 使用阿里云镜像
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        // 官方 Flutter 引擎仓库。
        // 原先用清华镜像 mirrors.tuna.tsinghua.edu.cn/flutter/download.flutter.io，
        // 该镜像已失效：找不到 flutter_embedding_release 等产物，
        // 报 "Could not find flutter_embedding_release-...jar"。
        // 已改用官方地址（本机走 gradle.properties 中配置的代理访问）。
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
        // 添加 Google Maven 仓库（用于 ML Kit）
        maven { url 'https://dl.google.com/dl/android/maven2' }
        google()
        mavenCentral()
        // 添加 JitPack 仓库（用于 tesseract4android）
        maven { url 'https://jitpack.io' }
        // 添加 Flutter 本地 Maven 仓库
        def flutterSdkPath = {
            def properties = new Properties()
            file("local.properties").withInputStream { properties.load(it) }
            def flutterSdkPath = properties.getProperty("flutter.sdk")
            assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
            return flutterSdkPath
        }()
        maven { url "$flutterSdkPath/bin/cache/artifacts" }
    }
}

// 强制使用 Java 17（解决 jlink 兼容性问题）
def java17Home = "C:\\\\Program Files\\\\Eclipse Adoptium\\\\jdk-17.0.17.10-hotspot"
if (file(java17Home).exists()) {
    gradle.beforeProject { project ->
        project.pluginManager.withPlugin('com.android.application') {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        project.pluginManager.withPlugin('com.android.library') {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

include ":app"
