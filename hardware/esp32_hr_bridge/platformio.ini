; ESP32-S3 手环心率桥接固件
;
; 作用：板子作为 BLE 主机连接手环，订阅标准心率服务 0x180D / 0x2A37，
;       解析出心率后通过 WiFi 上报到家庭健康中心后端。
;
; 烧写：pio run -t upload && pio device monitor
;
; 依赖说明：
;   NimBLE-Arduino —— 比 ESP32 自带的 Bluedroid 轻量得多，做 BLE 主机更稳
;   ArduinoJson    —— 构造/解析 JSON

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 板子同时用 BLE + WiFi，需要打开射频共存所需的内存配置
board_build.flash_mode = qio
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.0.4
